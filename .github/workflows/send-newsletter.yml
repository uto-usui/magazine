name: Send Newsletter

on:
  push:
    branches:
      - master
    paths:
      - 'newsletters/*.md'
      - 'newsletters/pickup/*.md'
  workflow_dispatch:
    inputs:
      file:
        description: '送信するファイル（例: newsletters/2026-10-29-130452.md）'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get new newsletter files
        id: get-files
        env:
          INPUT_FILE: ${{ inputs.file }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW_FILES="$INPUT_FILE"
          else
            # 1 回の push に複数コミットが入ることがあるので、HEAD~1 ではなく push 前の位置から比べる
            if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="HEAD~1"
            fi
            NEW_FILES=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'newsletters/*.md' 'newsletters/pickup/*.md' | tr '\n' ' ' || true)
          fi
          NEW_FILES=$(echo "$NEW_FILES" | xargs)
          echo "files=$NEW_FILES" >> $GITHUB_OUTPUT
          if [ -z "$NEW_FILES" ]; then
            echo "No new newsletter files found"
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "New files: $NEW_FILES"
            echo "has_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.get-files.outputs.has_files == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        if: steps.get-files.outputs.has_files == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - name: Install dependencies
        if: steps.get-files.outputs.has_files == 'true'
        run: pnpm install --frozen-lockfile

      - name: Send newsletters
        if: steps.get-files.outputs.has_files == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FILES: ${{ steps.get-files.outputs.files }}
        run: |
          set -o pipefail
          for file in $FILES; do
            echo "Sending: $file"
            pnpm run send-newsletter "$file" | tee -a sent.log
          done

      # Resend が受け付けても、相手のサーバーで弾かれることがある（2026-10 に受信箱の容量超過で 1 か月気づかなかった）
      - name: Check delivery
        if: steps.get-files.outputs.has_files == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MOSHI_TOKEN: ${{ secrets.MOSHI_TOKEN }}
        run: |
          IDS=$(grep -oE '\(id: [0-9a-f-]+\)' sent.log | grep -oE '[0-9a-f-]{36}' || true)
          [ -z "$IDS" ] && exit 0

          # 配達結果が出るまで最大 10 分待つ
          for i in $(seq 1 20); do
            sleep 30
            PENDING=""
            RESULTS=""
            for id in $IDS; do
              EVENT=$(curl -s -H "Authorization: Bearer $RESEND_API_KEY" "https://api.resend.com/emails/$id" | jq -r '.last_event')
              RESULTS="$RESULTS $id:$EVENT"
              case "$EVENT" in
                delivered|opened|clicked|bounced|complained|failed) ;;
                *) PENDING="$PENDING $id" ;;
              esac
            done
            [ -z "$PENDING" ] && break
          done

          echo "Results:$RESULTS"
          BAD=$(echo "$RESULTS" | tr ' ' '\n' | grep -vE ':(delivered|opened|clicked)$' | grep . || true)
          if [ -n "$BAD" ]; then
            echo "::error::届いていないメールがあります: $BAD"
            if [ -n "$MOSHI_TOKEN" ]; then
              MESSAGE="届いていないメール: $(echo $BAD | tr '\n' ' ') https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              jq -n --arg token "$MOSHI_TOKEN" --arg message "$MESSAGE" \
                '{token: $token, title: "Newsletter 配達失敗 ❌", message: $message}' |
                curl -s -X POST https://api.getmoshi.app/api/webhook -H "Content-Type: application/json" -d @-
            fi
            exit 1
          fi
