name: Sync Articles to Obsidian

on:
  push:
    branches:
      - master
    paths:
      - 'articles/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Checkout obsidian repository
        uses: actions/checkout@v4
        with:
          repository: uto-usui/obsidian
          token: ${{ secrets.OBSIDIAN_PAT }}
          path: obsidian-repo

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync articles (enrichment-preserving)
        run: |
          # NOTE: rsync --delete を使ってはいけない。
          # Obsidian 側で付与した enrichment（tags / Related Articles）を
          # 毎回上書き削除してしまうため。マージ型スクリプトで本文だけ更新する。
          pnpm sync-to-obsidian "$GITHUB_WORKSPACE/obsidian-repo/Articles"

          cd obsidian-repo

          # Stage changes first (to detect new untracked files)
          git add Articles/

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: Update articles from ux-eng-magazine"
          git push
