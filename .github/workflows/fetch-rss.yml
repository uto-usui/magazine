name: Fetch RSS Feeds

on:
  schedule:
    # Run daily at JST 09:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: 22.15.1
  # 新着記事 PR の記事数がこの数以上なら自動マージする
  AUTO_MERGE_THRESHOLD: 20

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # Sync to Obsidian の workflow_dispatch 用

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Fetch RSS feeds (capture log)
        id: fetch-rss
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          LOG_DIR="logs/fetch-rss"
          LOG_TMP="${LOG_DIR}/fetch-rss.tmp.log"
          mkdir -p "$LOG_DIR"
          pnpm run fetch-rss 2>&1 | tee "$LOG_TMP"
          EXIT_CODE=${PIPESTATUS[0]}

          ARTICLE_PATH=$(git status --porcelain -- articles/ | head -1 | sed -E 's/^.. //')
          DATE_DIR=""
          if [ -n "$ARTICLE_PATH" ]; then
            DATE_DIR=$(echo "$ARTICLE_PATH" | cut -d/ -f2)
          fi
          if [ -z "$DATE_DIR" ]; then
            DATE_DIR="unknown-date"
          fi

          # Only capture actionable failures. Skip warning-level fallback/bot-detection noise.
          ISSUE_PATTERN="(Errors: [1-9][0-9]*|Fatal error|Failed to fetch feed|Failed to fetch https?://.* after [0-9]+ retries|❌ Playwright failed for|Could not extract content and no RSS content available|Readability bug detected)"
          HAS_ISSUES="false"
          if [ "$EXIT_CODE" -ne 0 ]; then
            HAS_ISSUES="true"
          elif grep -Eq "$ISSUE_PATTERN" "$LOG_TMP"; then
            HAS_ISSUES="true"
          fi

          if [ "$HAS_ISSUES" = "true" ]; then
            LOG_FILE="${LOG_DIR}/${DATE_DIR}_$(date -u +%Y-%m-%dT%H%M%SZ).log"
            {
              echo "articles_dir=${DATE_DIR}"
              echo "exit_code=${EXIT_CODE}"
              echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "---- issue lines ----"
              grep -En "$ISSUE_PATTERN" "$LOG_TMP" || true
              echo ""
              echo "---- tail (last 50 lines) ----"
              tail -n 50 "$LOG_TMP"
            } > "$LOG_FILE"
            echo "log_path=$LOG_FILE" >> "$GITHUB_OUTPUT"
          fi

          rm "$LOG_TMP"

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "has_issue_log=$HAS_ISSUES" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        if: steps.fetch-rss.outputs.exit_code == '0'
        id: check-changes
        run: |
          # Check if there are article or image changes (not just state/processed.json)
          # Use git status --porcelain to detect both modified and new (untracked) files
          ARTICLE_CHANGES=$(git status --porcelain -- articles/ images/ | wc -l | tr -d ' ')
          # 未マージの state は master に無いので、前回までの未マージ分もこの数に含まれる
          ARTICLE_COUNT=$(git status --porcelain --untracked-files=all -- 'articles/*.md' | wc -l | tr -d ' ')
          echo "article_count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT

          if [ "$ARTICLE_CHANGES" -eq 0 ]; then
            echo "No article changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Article changes detected: $ARTICLE_CHANGES files"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit state only (no PR needed)
        if: steps.fetch-rss.outputs.exit_code == '0' && steps.check-changes.outputs.has_changes == 'false'
        run: |
          # Check if state file changed
          if git diff --quiet -- state/; then
            echo "No state changes either"
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state/
          git commit -m "chore: Update lastRun timestamp"
          git push

      - name: Create branch and commit
        if: steps.fetch-rss.outputs.exit_code == '0' && steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Create branch name with date and time to avoid conflicts on re-runs
          BRANCH="rss-updates/$(date -u +%Y-%m-%d-%H%M)"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          # Create and checkout new branch
          git checkout -b "$BRANCH"

          # Add all changes
          git add articles/ images/ state/

          # Commit with timestamp
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "chore: Fetch RSS feeds - ${TIMESTAMP}"

          # Push branch
          git push -u origin "$BRANCH"

      - name: Create Pull Request
        if: steps.fetch-rss.outputs.exit_code == '0' && steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate article list from added files
          ARTICLE_LIST=""
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              # Extract title from frontmatter
              TITLE=$(grep -m1 "^title:" "$file" | sed 's/title: "//' | sed 's/"$//')
              if [ -n "$TITLE" ]; then
                ARTICLE_LIST+="- ${TITLE}"$'\n'
              fi
            fi
          done < <(git diff --name-only origin/master -- articles/)

          # If no articles found, use file names
          if [ -z "$ARTICLE_LIST" ]; then
            while IFS= read -r file; do
              ARTICLE_LIST+="- $(basename "$file")"$'\n'
            done < <(git diff --name-only origin/master -- articles/)
          fi

          # Create PR with article list in body
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          PR_BODY=$'## 新着記事\n\n'"${ARTICLE_LIST}"

          gh pr create \
            --title "📰 ${TIMESTAMP} の新着記事" \
            --body "$PR_BODY" \
            --base master \
            --reviewer uto-usui

      - name: Auto-merge when enough articles
        id: auto-merge
        if: steps.fetch-rss.outputs.exit_code == '0' && steps.check-changes.outputs.has_changes == 'true' && fromJSON(steps.check-changes.outputs.article_count) >= fromJSON(env.AUTO_MERGE_THRESHOLD)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTICLE_COUNT: ${{ steps.check-changes.outputs.article_count }}
        run: |
          NEW_PR=$(gh pr view "$BRANCH" --json number -q .number)
          # --delete-branch はローカルの checkout も切り替えようとするので、リモートのブランチだけ API で消す
          gh pr merge "$NEW_PR" --squash
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
          echo "merged=true" >> $GITHUB_OUTPUT

          # 古い未マージ PR の記事は今回の PR に含まれていて、state が競合するので閉じる
          gh pr list --state open --base master --json number,headRefName \
            -q '.[] | select(.headRefName | startswith("rss-updates/")) | "\(.number) \(.headRefName)"' |
          while read -r n ref; do
            gh pr close "$n" --comment "#${NEW_PR} に記事が含まれる形で自動マージしたため閉じます"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}" || true
          done

          # GITHUB_TOKEN による push では push トリガーの workflow が動かないため明示的に起動する
          gh workflow run sync-to-obsidian.yml --ref master

      - name: Create issue log branch and commit
        if: steps.fetch-rss.outputs.has_issue_log == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Always branch from master so the issue PR only contains log files.
          git checkout master
          git pull --ff-only origin master

          # Create branch for issue log
          BRANCH="fetch-rss-issues/$(date -u +%Y-%m-%d-%H%M)"
          echo "ISSUE_BRANCH=$BRANCH" >> $GITHUB_ENV

          git checkout -b "$BRANCH"
          git add "${{ steps.fetch-rss.outputs.log_path }}"
          git commit -m "chore: Save fetch-rss issue log"
          git push -u origin "$BRANCH"

      - name: Create issue log PR
        if: steps.fetch-rss.outputs.has_issue_log == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract issue lines from log file
          LOG_FILE="${{ steps.fetch-rss.outputs.log_path }}"
          ISSUE_LINES=$(grep -A 100 "^---- issue lines ----" "$LOG_FILE" | grep -B 100 "^---- tail" | grep -v "^----" | head -20)

          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          PR_BODY=$(cat <<EOF
          ## ⚠️ RSS取得で問題が発生しました

          ### 検出された問題
          \`\`\`
          ${ISSUE_LINES}
          \`\`\`

          ### 対応方法
          1. このPRをマージしてログを保存
          2. ローカルで \`pnpm run fetch-rss\` を実行して確認
          3. 必要に応じて \`config/feeds.yml\` を修正

          詳細は [ログファイル](${LOG_FILE}) を確認してください。
          EOF
          )

          gh pr create \
            --title "⚠️ ${TIMESTAMP} RSS取得エラー" \
            --body "$PR_BODY" \
            --base master \
            --reviewer uto-usui

      - name: Fail job if fetch-rss failed
        if: steps.fetch-rss.outputs.exit_code != '0'
        run: |
          exit 1

      - name: Notify Moshi
        if: always()
        env:
          MOSHI_TOKEN: ${{ secrets.MOSHI_TOKEN }}
        run: |
          if [ -z "$MOSHI_TOKEN" ]; then
            echo "MOSHI_TOKEN is not set, skipping notification"
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="Fetch RSS ✅"
          MESSAGE="fetch-rss completed: ${RUN_URL}"

          if [ "${{ job.status }}" != "success" ]; then
            TITLE="Fetch RSS ❌"
            if [ "${{ steps.fetch-rss.outputs.exit_code }}" != "0" ]; then
              MESSAGE="RSS取得が失敗しました。Actions を確認してください: ${RUN_URL}"
            else
              MESSAGE="新着記事のPR作成・自動マージ中に失敗しました。Actions を確認してください: ${RUN_URL}"
            fi
          else
            if [ "${{ steps.auto-merge.outputs.merged }}" = "true" ]; then
              MESSAGE="新着記事 ${{ steps.check-changes.outputs.article_count }} 件の PR を自動マージしました"
            elif [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
              MESSAGE="新着記事 ${{ steps.check-changes.outputs.article_count }} 件の PR を作成しました（${AUTO_MERGE_THRESHOLD} 件未満のため未マージ）"
            else
              MESSAGE="新着記事はありませんでした"
            fi
            # issue log は毎日出ることがあるので、記事の状況を隠さないよう追記する
            if [ "${{ steps.fetch-rss.outputs.has_issue_log }}" = "true" ]; then
              TITLE="Fetch RSS ⚠️"
              MESSAGE="${MESSAGE}。RSS取得で問題を検出し issue log PR を作成しました"
            fi
            MESSAGE="${MESSAGE}: ${RUN_URL}"
          fi

          curl -s -X POST https://api.getmoshi.app/api/webhook \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$MOSHI_TOKEN\", \"title\": \"$TITLE\", \"message\": \"$MESSAGE\"}"
