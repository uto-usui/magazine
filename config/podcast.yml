# 音声バージョン（Gemini TTS で作る MP3）の設定

model: gemini-3.8-flash-lite-tts

speakers:
  A:
    name: Aoi
    voice: Kore
    style: 落ち着いた朝のラジオの案内役
  B:
    name: Ren
    voice: Puck
    style: 気さくな聞き手

budget:
  monthlyJpy: 1000
  # 円安に振れても上限を超えないよう、実勢より高めの換算レートにしている
  usdJpy: 160
  warnRatio: 0.8

limits:
  # 実測で約6.1字/秒。15分 ≒ 5,500字
  maxScriptChars: 5500
  # poller のリトライや手動の再実行で、同じ日に何本も作らないための上限
  maxEpisodesPerDay: 2
  # 話す速さの揺れを見込んで、見積もりを多めにとる倍率
  estimateMargin: 1.3

speech:
  charsPerSecond: 6.1
  audioTokensPerSecond: 25

# Standard（有料）tier の USD / 1M tokens。2026-11-06 に料金ページで確認
# https://ai.google.dev/gemini-api/docs/pricing
# model を変えたら、この表もそのモデルの料金に差し替えること（model が一致しないと起動時にエラーにする）
pricing:
  model: gemini-3.8-flash-lite-tts
  periods:
    - from: '2026-01-01'
      inputPerM: 0.5
      outputPerM: 6
    - from: '2027-01-01'
      inputPerM: 1
      outputPerM: 12

# X に投稿する MP4（既定は全編の1本、--clips で記事ごとも）。reel の talk-lab がブラウザ内（WebCodecs）でエンコードする
video:
  appUrl: https://uto-reel.me-e6a.workers.dev/talk-lab
  style: flame
  preset: x-landscape
  bitrateMbps: 4
  # X Premium の上限。2時間を超えると 720p が必要になるので、1080p のまま上げられる2時間までにしている。
  # 大きさは資料によって 8GB と 16GB に分かれるので、小さいほうに合わせた。通常アカウントなら 140 秒・512MB
  maxDurationSec: 7200
  maxSizeMb: 8192
