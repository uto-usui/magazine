<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 381" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two panels separated by an axis break. The left panel counts dinosaur genera from 250 million years ago to the present: the line climbs through the Mesozoic to about 950 genera, then falls vertically to zero at the Cretaceous-Paleogene boundary 66 million years ago. The red line for disclosed AI-enabled cyberattacks picks up exactly where the dinosaur line hits zero, runs flat along the floor across the axis break into the 2015-to-2026 panel, then rises steeply from 2023 to fourteen. An annotation reads r equals minus 0.98." width="800" height="381">
