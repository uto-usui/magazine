<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 355" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Horizontal bars of continuous power draw on a log scale from 0.01 kilowatts to 1 megawatt, with a watts-per-kilogram column on the right. A resting human draws 0.08 kilowatts, an ostrich 0.3, a Tyrannosaurus rex 0.5 and a 70-tonne Argentinosaurus 2. One GPU rack draws 120 and one 100-megawatt datacenter hall draws 100,000. Per kilogram the rack draws roughly 88 watts against the sauropod's 0.03." width="800" height="355">
<style>
svg{color:#000}
svg{font:13px sans-serif}
.axis{font-size:12px;fill:currentColor;opacity:0.6}
.grid{stroke:currentColor;stroke-opacity:0.12}
.lab{font-size:12px;fill:currentColor}
.lab-sm{font-size:10.5px;fill:currentColor;opacity:0.72}
.lgd{fill:currentColor;font-size:13px}
</style>
<text class="lab-sm" x="770" y="44" text-anchor="end">W/kg</text>
<line class="grid" x1="200" y1="52" x2="200" y2="256"/><line class="grid" x1="262.5" y1="52" x2="262.5" y2="256"/><line class="grid" x1="325" y1="52" x2="325" y2="256"/><line class="grid" x1="387.5" y1="52" x2="387.5" y2="256"/><line class="grid" x1="450" y1="52" x2="450" y2="256"/><line class="grid" x1="512.5" y1="52" x2="512.5" y2="256"/><line class="grid" x1="575" y1="52" x2="575" y2="256"/><line class="grid" x1="637.5" y1="52" x2="637.5" y2="256"/><line class="grid" x1="700" y1="52" x2="700" y2="256"/>
<text class="axis" x="200" y="276" text-anchor="middle">0.01</text><text class="axis" x="262.5" y="276" text-anchor="middle">0.1</text><text class="axis" x="325" y="276" text-anchor="middle">1</text><text class="axis" x="387.5" y="276" text-anchor="middle">10</text><text class="axis" x="450" y="276" text-anchor="middle">100</text><text class="axis" x="512.5" y="276" text-anchor="middle">1k</text><text class="axis" x="575" y="276" text-anchor="middle">10k</text><text class="axis" x="637.5" y="276" text-anchor="middle">100k</text><text class="axis" x="700" y="276" text-anchor="middle">1M</text>
<text class="lab" x="192" y="73" text-anchor="end">Human, at rest</text><rect x="200" y="61" width="56.4" height="16" rx="2" fill="#16a34a"/><text class="lab-sm" x="770" y="73" text-anchor="end">1.3</text>
<text class="lab" x="192" y="107" text-anchor="end">Ostrich, at rest</text><rect x="200" y="95" width="92.3" height="16" rx="2" fill="#16a34a"/><text class="lab-sm" x="770" y="107" text-anchor="end">2.4</text>
<text class="lab" x="192" y="141" text-anchor="end">Tyrannosaurus (7 t)</text><rect x="200" y="129" width="106.2" height="16" rx="2" fill="#16a34a"/><text class="lab-sm" x="770" y="141" text-anchor="end">0.07</text>
<text class="lab" x="192" y="175" text-anchor="end">Argentinosaurus (70 t)</text><rect x="200" y="163" width="143.8" height="16" rx="2" fill="#16a34a"/><text class="lab-sm" x="770" y="175" text-anchor="end">0.03</text>
<text class="lab" x="192" y="209" text-anchor="end">One GPU rack (NVL72)</text><rect x="200" y="197" width="254.9" height="16" rx="2" fill="#dc2626"/><text class="lab-sm" x="770" y="209" text-anchor="end">88</text>
<text class="lab" x="192" y="243" text-anchor="end">One 100 MW datacenter hall</text><rect x="200" y="231" width="437.5" height="16" rx="2" fill="#dc2626"/><text class="lab-sm" x="770" y="243" text-anchor="end">4</text>
<text class="axis" x="450" y="298" text-anchor="middle">continuous power draw (kW, log scale)</text>
<rect x="246.5" y="327" width="14" height="14" rx="2" fill="#16a34a"/><text class="lgd" x="266.5" y="339">basal metabolism (ectotherm)</text><rect x="483.5" y="327" width="14" height="14" rx="2" fill="#dc2626"/><text class="lgd" x="503.5" y="339">silicon</text></svg>
