<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 389" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two projected lines of United States employment in millions from 2026 to 2040. Jobs remaining after AI fall in a straight line from 160 million to under 2 million, a 99 percent loss. Jurassic Park employment starts near zero and rises exponentially, crossing the falling line at about 36 million in 2037 and reaching 220 million by 2040." width="800" height="389">
