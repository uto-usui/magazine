<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Four vertical bars comparing standing height in metres. Argentinosaurus reaches 12 metres with its head raised, Tyrannosaurus rex about 5 metres, a server rack 2.2 metres, and a human 1.7 metres." width="800" height="356">
<style>
svg{color:#000}
svg{font:13px sans-serif}
.axis{font-size:12px;fill:currentColor;opacity:0.6}
.grid{stroke:currentColor;stroke-opacity:0.12}
.lab{font-size:12px;fill:currentColor}
.lab-sm{font-size:10.5px;fill:currentColor;opacity:0.72}
</style>
<line class="grid" x1="100" y1="300" x2="700" y2="300"/><line class="grid" x1="100" y1="260" x2="700" y2="260"/><line class="grid" x1="100" y1="220" x2="700" y2="220"/><line class="grid" x1="100" y1="180" x2="700" y2="180"/><line class="grid" x1="100" y1="140" x2="700" y2="140"/><line class="grid" x1="100" y1="100" x2="700" y2="100"/><line class="grid" x1="100" y1="60" x2="700" y2="60"/>
<text class="axis" x="92" y="304" text-anchor="end">0</text><text class="axis" x="92" y="264" text-anchor="end">2</text><text class="axis" x="92" y="224" text-anchor="end">4</text><text class="axis" x="92" y="184" text-anchor="end">6</text><text class="axis" x="92" y="144" text-anchor="end">8</text><text class="axis" x="92" y="104" text-anchor="end">10</text><text class="axis" x="92" y="64" text-anchor="end">12</text>
<rect x="145" y="60" width="90" height="240" rx="2" fill="#166534"/><text class="lab" x="190" y="52" text-anchor="middle">12 m</text>
<rect x="285" y="200" width="90" height="100" rx="2" fill="#166534"/><text class="lab" x="330" y="192" text-anchor="middle">5 m</text>
<rect x="425" y="256" width="90" height="44" rx="2" fill="#dc2626"/><text class="lab" x="470" y="248" text-anchor="middle">2.2 m</text>
<rect x="565" y="266" width="90" height="34" rx="2" fill="#475569"/><text class="lab" x="610" y="258" text-anchor="middle">1.7 m</text>
<line x1="100" y1="300" x2="700" y2="300" stroke="currentColor" stroke-opacity="0.45"/>
<text class="lab" x="190" y="320" text-anchor="middle">Argentinosaurus</text><text class="lab-sm" x="190" y="336" text-anchor="middle">head raised</text>
<text class="lab" x="330" y="320" text-anchor="middle">Tyrannosaurus rex</text><text class="lab-sm" x="330" y="336" text-anchor="middle">standing</text>
<text class="lab" x="470" y="320" text-anchor="middle">Server rack</text><text class="lab-sm" x="470" y="336" text-anchor="middle">GB200 NVL72</text>
<text class="lab" x="610" y="320" text-anchor="middle">Human</text><text class="lab-sm" x="610" y="336" text-anchor="middle">for scale</text>
<text class="axis" x="52" y="180" text-anchor="middle" transform="rotate(-90 52 180)">height (m)</text>
</svg>
