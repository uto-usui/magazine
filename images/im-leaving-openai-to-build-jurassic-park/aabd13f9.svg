<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 397" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A scatter of encephalization quotient against body mass on a log scale, split into four quadrants. Humans sit highest among animals at 7.5 and 62 kilograms; dolphins and chimpanzees follow. Velociraptor beats a chicken. Tyrannosaurus rex reaches 2.2 at seven tonnes, while Stegosaurus, Triceratops and Argentinosaurus sit near the floor in the large-and-dim quadrant. Two language models are drawn as hollow markers above every animal." width="800" height="397">
<style>
svg{color:#000}
svg{font:13px sans-serif}
.axis{font-size:12px;fill:currentColor;opacity:0.6}
.grid{stroke:currentColor;stroke-opacity:0.12}
.lab{font-size:12px;fill:currentColor}
.lab-sm{font-size:10.5px;fill:currentColor;opacity:0.72}
.quad{font-size:11px;fill:currentColor;opacity:0.45}
.lgd{fill:currentColor;font-size:13px}
</style>
