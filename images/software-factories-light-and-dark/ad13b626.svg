<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unbounded generation meets a narrow verification gate" style="width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="sfd-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A8574"/></marker>
  </defs>
  <rect x="8" y="8" width="1104" height="384" rx="20" fill="#FAF8F1" stroke="#E7E1D3" stroke-width="2"/>
  <text x="560" y="52" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.5" fill="#C8891A">THE FUNNEL</text>

  <!-- generation side -->
  <text x="150" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23221E">how much can you</text>
  <text x="150" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23221E">stuff in the queue?</text>
  <text x="150" y="140" text-anchor="middle" font-size="12" font-style="italic" fill="#2E7D57">unbounded · cheap</text>
  <g fill="#FFFFFF" stroke="#DAD3C2" font-size="11">
    <rect x="60" y="160" width="120" height="26" rx="6"/><text x="120" y="178" text-anchor="middle" fill="#23221E">PR</text>
    <rect x="60" y="192" width="120" height="26" rx="6"/><text x="120" y="210" text-anchor="middle" fill="#23221E">PR</text>
    <rect x="60" y="224" width="120" height="26" rx="6"/><text x="120" y="242" text-anchor="middle" fill="#23221E">PR</text>
    <rect x="60" y="256" width="120" height="26" rx="6"/><text x="120" y="274" text-anchor="middle" fill="#23221E">PR</text>
    <rect x="60" y="288" width="120" height="26" rx="6"/><text x="120" y="306" text-anchor="middle" fill="#23221E">PR</text>
  </g>

  <!-- funnel -->
  <path d="M 230,150 L 560,215 L 560,255 L 230,320 Z" fill="#F3EFE4" stroke="#DAD3C2" stroke-width="2"/>
  <line x1="200" y1="173" x2="250" y2="180" stroke="#8A8574" stroke-width="2" marker-end="url(#sfd-arrow)"/>
  <line x1="200" y1="235" x2="250" y2="235" stroke="#8A8574" stroke-width="2" marker-end="url(#sfd-arrow)"/>
  <line x1="200" y1="297" x2="250" y2="290" stroke="#8A8574" stroke-width="2" marker-end="url(#sfd-arrow)"/>

  <!-- gate -->
  <rect x="560" y="196" width="150" height="78" rx="12" fill="#FCE9BE" stroke="#C8891A" stroke-width="2.5"/>
  <text x="635" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23221E">review</text>
  <text x="635" y="248" text-anchor="middle" font-size="12" fill="#7a5a12">verification</text>
  <text x="635" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C8891A">the real limit</text>

  <!-- out -->
  <line x1="710" y1="235" x2="770" y2="235" stroke="#8A8574" stroke-width="2" marker-end="url(#sfd-arrow)"/>
  <rect x="772" y="208" width="110" height="54" rx="10" fill="#D7EEDF" stroke="#2E7D57"/><text x="827" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#1F5B3E">shipped</text>

  <text x="965" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#23221E">bounded by</text>
  <text x="965" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#23221E">human attention</text>

  <text x="560" y="356" text-anchor="middle" font-size="14.5" font-style="italic" fill="#23221E">"You don't have too many PRs. You have too many <tspan font-weight="700">bad</tspan> PRs." — Dex Horthy</text>
</svg>
